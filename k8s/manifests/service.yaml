# Framework.Api NodePort 서비스
# kind extraPortMappings(30080)와 일치시켜 호스트에서 localhost:30080 으로 직접 접근 가능
# k6 시나리오 BASE_URL=http://localhost:30080 에 대응
apiVersion: v1
kind: Service
metadata:
  name: framework-api
spec:
  # NodePort: 모든 노드의 30080 포트로 들어오는 트래픽을 파드로 라우팅
  type: NodePort
  selector:
    # Deployment pod template 의 label 과 일치해야 트래픽 전달됨
    app: framework-api
  ports:
    - port: 80           # 클러스터 내부에서 Service 접근 시 사용하는 포트
      targetPort: 8080   # 컨테이너(파드) 포트 — Dockerfile EXPOSE 및 containerPort 와 일치
      nodePort: 30080    # 외부(호스트)에서 접근하는 포트 — kind portMapping 과 일치
      protocol: TCP
